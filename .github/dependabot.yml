version: 2

updates:
  # Actions used in .github/workflows (checkout, gitleaks-action, ...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies in pyproject.toml and uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
